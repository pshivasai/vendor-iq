<!doctype html>
<html lang="en">
  <head>
    <!-- When embedded by Streamlit Community Cloud, tell the host page the app is ready so it removes its loading spinner. -->
    <script>
      (function () {
        if (window.parent === window) return;
        var send = function (m) { m.stCommVersion = 1; window.parent.postMessage(m, '*'); };
        var ready = function () {
          var now = Date.now();
          send({type: 'GUEST_READY', streamlitExecutionStartedAt: now, guestReadyAt: now});
          send({type: 'WEBSOCKET_CONNECTED'});
          send({type: 'SCRIPT_RUN_STATE_CHANGED', scriptRunState: 'notRunning'});
        };
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', ready); else ready();
      })();
    </script>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><meta name="theme-color" content="#101b2d"/><title>VendorIQ · Supplier onboarding</title></head>
  <body><div id="root"></div><script type="module" src="/src/main.jsx"></script></body>
</html>
